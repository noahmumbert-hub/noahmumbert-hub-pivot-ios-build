name: Export pinned Max166 failure evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  export-original-failure:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'noahmumbert-hub/noahmumbert-hub-pivot-ios-build'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Verify and export only the original failed case
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python3 - <<'PIVOT_EXPORT_PY'
          """Read-only re-export of one pinned failed XCTest case; embedded in the YAML draft."""
          from pathlib import Path, PurePosixPath
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          import shutil
          import stat
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          REPOSITORY = 'noahmumbert-hub/noahmumbert-hub-pivot-ios-build'
          SOURCE = '4c5d493a32c64437016a449127973113982cf754'
          ORIGINAL_RUN = 41369826898
          ARTIFACT = 13110904533
          ARTIFACT_NAME = 'PIVOT-iPhone-xcresult-iPhone 16 Pro Max-166-1'
          ZIP_SIZE = 592077232
          ZIP_SHA256 = '06049be496cd6aa8239fb1042bc81ca9b914933257034463c3692d56beac38a4'
          CASE = 'PIVOTUITests/testLowestWaitEvidenceAndHourlySheetStayConsistentAtAccessibilityTextSize()'
          API_URL = 'https://api.github.com/repos/' + REPOSITORY + '/actions/artifacts/' + str(ARTIFACT)
          EXPECTED_FILES = {
              'EF3D8ECB-2695-46CE-92B4-21D2C8259A46.mp4': 'screen-recording',
              '3C1AA184-587C-4E6E-AB03-DC1A210232C9': 'accessibility-snapshot',
              'D2D11977-348D-4FA1-A668-E6065CBE0474': 'accessibility-snapshot',
              '28B94215-7CB8-4FBD-9D4B-A38D5F72DC26': 'accessibility-snapshot',
              'BA7AE6F7-61AB-45A6-AB2E-8222E3757BA8': 'accessibility-snapshot',
              'D6E2BC59-3011-4F6B-9A12-C1EC54F3F4AA': 'accessibility-snapshot',
              '2DF6FB92-973C-4B8B-AA52-ECB515D56066': 'accessibility-snapshot',
              '01E68D88-208B-492E-B32C-BC11AF8CC060': 'accessibility-snapshot',
          }
          
          
          def require(value, message):
              if not value:
                  raise ValueError(message)
          
          
          def digest(path):
              result = hashlib.sha256()
              with Path(path).open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      result.update(block)
              return result.hexdigest()
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  return None
          
          
          def api_request(url, token):
              require(url in (API_URL, API_URL + '/zip'), 'Unexpected authenticated API endpoint')
              return urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'PIVOT-pinned-failure-evidence-export',
              })
          
          
          def validate_metadata(metadata):
              require(metadata.get('id') == ARTIFACT and metadata.get('name') == ARTIFACT_NAME
                      and metadata.get('size_in_bytes') == ZIP_SIZE
                      and metadata.get('digest') == 'sha256:' + ZIP_SHA256
                      and metadata.get('expired') is False, 'Original API artifact identity differs')
              run = metadata.get('workflow_run', {})
              require(run.get('id') == ORIGINAL_RUN and run.get('head_sha') == SOURCE
                      and run.get('repository_id') == 1413570756
                      and run.get('head_repository_id') == 1413570756, 'Original API source/run differs')
              require(metadata.get('url') == API_URL and metadata.get('archive_download_url') == API_URL + '/zip',
                      'Original API endpoint differs')
          
          
          def get_metadata(token):
              opener = urllib.request.build_opener(NoRedirect())
              with opener.open(api_request(API_URL, token), timeout=60) as response:
                  require(response.status == 200, 'Metadata request did not return 200')
                  raw = response.read(1024 * 1024 + 1)
              require(len(raw) <= 1024 * 1024, 'API metadata exceeds the bounded size')
              metadata = json.loads(raw)
              validate_metadata(metadata)
              return metadata, raw
          
          
          def validate_download_location(location):
              parsed = urllib.parse.urlsplit(location)
              host = (parsed.hostname or '').lower()
              require(parsed.scheme == 'https' and parsed.username is None and parsed.password is None
                      and parsed.port in (None, 443) and bool(parsed.query)
                      and (host.endswith('.blob.core.windows.net') or host.endswith('.actions.githubusercontent.com')),
                      'Download redirect is not an expected HTTPS artifact origin')
              return location
          
          
          def signed_zip_location(token):
              opener = urllib.request.build_opener(NoRedirect())
              try:
                  response = opener.open(api_request(API_URL + '/zip', token), timeout=60)
              except urllib.error.HTTPError as error:
                  try:
                      require(error.code == 302, 'Artifact API must return its signed redirect')
                      location = error.headers.get('Location')
                      require(isinstance(location, str), 'Artifact API redirect is absent')
                      return validate_download_location(location)
                  finally:
                      error.close()
              else:
                  response.close()
                  raise ValueError('Artifact API must return its signed redirect')
          
          
          def download_zip(location, path):
              validate_download_location(location)
              # A new request/opener has no GitHub Authorization header and does not follow redirects.
              request = urllib.request.Request(location, headers={'User-Agent': 'PIVOT-pinned-failure-evidence-export'})
              opener = urllib.request.build_opener(NoRedirect())
              count, result = 0, hashlib.sha256()
              with opener.open(request, timeout=60) as response, Path(path).open('xb') as output:
                  require(response.status == 200, 'Signed artifact download did not return 200')
                  length = response.headers.get('Content-Length')
                  require(length is None or int(length) == ZIP_SIZE, 'Signed artifact length differs')
                  for block in iter(lambda: response.read(1024 * 1024), b''):
                      count += len(block)
                      require(count <= ZIP_SIZE, 'Artifact download exceeds its exact size')
                      result.update(block)
                      output.write(block)
              require(count == ZIP_SIZE and result.hexdigest() == ZIP_SHA256, 'Original ZIP size/SHA256 differs')
          
          
          def extract_bundle(archive, destination):
              records = []
              require(not Path(destination).exists(), 'Result extraction directory already exists')
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  require(len(entries) <= 100000 and sum(info.file_size for info in entries) <= 8 * 1024**3,
                          'Result ZIP exceeds bounded extraction limits')
                  names, folded = set(), set()
                  paths = {}
                  for info in entries:
                      name = info.filename
                      require(name and not name.startswith('/') and '\\' not in name and '\x00' not in name
                              and all(part not in ('', '.', '..') for part in name.rstrip('/').split('/')),
                              'Unsafe result ZIP member path')
                      path = PurePosixPath(name)
                      require(name not in names and str(path).casefold() not in folded, 'Duplicate result ZIP member')
                      names.add(name); folded.add(str(path).casefold()); paths[name] = path
                      kind = stat.S_IFMT(info.external_attr >> 16)
                      require(kind in (0, stat.S_IFREG, stat.S_IFDIR) and not (info.flag_bits & 1),
                              'Symlink/special/encrypted result ZIP member is not permitted')
                  databases = [paths[info.filename] for info in entries if not info.is_dir()
                               and paths[info.filename].name == 'database.sqlite3']
                  require(len(databases) == 1, 'Need exactly one original result database')
                  base = databases[0].parent
                  require(str(base / 'Info.plist') in names, 'Original result Info.plist is absent')
                  for info in entries:
                      path = paths[info.filename]
                      if path == base or path in base.parents:
                          require(info.is_dir(), 'Unexpected result ZIP file outside bundle')
                          continue
                      require(path.is_relative_to(base), 'Unexpected result ZIP member outside bundle')
                      relative = path.relative_to(base)
                      target = Path(destination).joinpath(*relative.parts)
                      if info.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      result, count = hashlib.sha256(), 0
                      with bundle.open(info) as source, target.open('xb') as output:
                          for block in iter(lambda: source.read(1024 * 1024), b''):
                              count += len(block)
                              require(count <= info.file_size, 'Extracted member exceeds its declared size')
                              result.update(block); output.write(block)
                      require(count == info.file_size, 'Extracted member length differs')
                      records.append({'archiveMember': info.filename, 'resultMember': str(relative),
                                      'bytes': count, 'sha256': result.hexdigest(), 'zipCRC32': info.CRC})
              return sorted(records, key=lambda item: item['archiveMember'])
          
          
          def select_case(exported):
              matches = [case for case in exported if case.get('testIdentifier') == CASE]
              require(len(matches) == 1, 'Need one exact failed test case in the original export manifest')
              case = matches[0]
              attachments = case.get('attachments', [])
              selected = [item for item in attachments if item.get('exportedFileName') in EXPECTED_FILES]
              names = [item.get('exportedFileName') for item in selected]
              require(len(names) == len(set(names)) == 8 and set(names) == set(EXPECTED_FILES),
                      'The exact seven AX snapshots and one MP4 must all be present')
              relevant = [item for item in attachments
                          if item.get('suggestedHumanReadableName', '').startswith(('UI Snapshot ', 'Screen Recording '))]
              require({item.get('exportedFileName') for item in relevant} == set(EXPECTED_FILES)
                      and len(relevant) == 8, 'Unexpected AX/MP4 attachment in the failed case')
              for item in selected:
                  require(item.get('deviceName') == 'iPhone 16 Pro Max', 'Attachment device differs')
                  name = item['exportedFileName']
                  require(Path(name).name == name, 'Unsafe attachment filename')
                  expected_prefix = 'Screen Recording ' if name.endswith('.mp4') else 'UI Snapshot '
                  require(item.get('suggestedHumanReadableName', '').startswith(expected_prefix), 'Attachment role differs')
              return [{**case, 'attachments': selected}]
          
          
          def main():
              root = Path(os.environ['RUNNER_TEMP']) / 'pivot-failure-export'
              output, work, selected_dir = root / 'export-output', root / 'work', root / 'selected-stage'
              phase = 'initialization'
              original_identity = {'originalSourceSHA': SOURCE, 'originalRunID': ORIGINAL_RUN,
                                   'originalArtifactID': ARTIFACT, 'originalZIP_SHA256': ZIP_SHA256,
                                   'originalTestIdentifier': CASE, 'nativeTestsRerun': False,
                                   'releaseGateCleared': False, 'publicationPerformed': False}
              try:
                  require(not root.exists(), 'Diagnostic scratch directory already exists')
                  output.mkdir(parents=True); work.mkdir()
                  (output / 'provenance.json').write_text(json.dumps({'status': 'started', **original_identity}, indent=2) + '\n')
                  require(os.environ.get('GITHUB_REPOSITORY') == REPOSITORY, 'Diagnostic repository differs')
                  token = os.environ.pop('GITHUB_TOKEN', '')
                  require(bool(token), 'Read-only GitHub token is absent')
                  phase = 'toolchain'
                  toolchain = subprocess.run(['xcodebuild', '-version'], check=True, capture_output=True, text=True, timeout=30).stdout
                  require(toolchain.splitlines()[0] == 'Xcode 26.3', 'Xcode 26.3 must be selected')
                  phase = 'API-metadata'
                  metadata, raw_metadata = get_metadata(token)
                  phase = 'API-redirect'
                  location = signed_zip_location(token)
                  del token
                  phase = 'signed-ZIP-download'
                  archive = work / 'original-artifact.zip'
                  download_zip(location, archive)
                  del location
                  phase = 'safe-result-extraction'
                  result_path = work / 'native-tests.xcresult'
                  members = extract_bundle(archive, result_path)
                  phase = 'original-attachment-export'
                  all_exports = work / 'all-attachments'
                  command = ['xcrun', 'xcresulttool', 'export', 'attachments', '--path', str(result_path),
                             '--output-path', str(all_exports)]
                  # This exact command form is proven in original4c scripts/test-native.sh:219.
                  subprocess.run(command, check=True, capture_output=True, text=True, timeout=600,
                                 env={key: value for key, value in os.environ.items() if key not in ('GITHUB_TOKEN', 'GH_TOKEN')})
                  phase = 'exact-case-filter-and-hashes'
                  original_manifest = all_exports / 'manifest.json'
                  filtered = select_case(json.loads(original_manifest.read_text()))
                  selected_dir.mkdir()
                  attachment_proofs = []
                  for attachment in filtered[0]['attachments']:
                      name = attachment['exportedFileName']
                      path = all_exports / name
                      require(path.is_file() and not path.is_symlink() and path.stat().st_size > 0,
                              'Selected original attachment is absent or empty')
                      target = selected_dir / name
                      shutil.copyfile(path, target)
                      require(digest(path) == digest(target), 'Copied attachment differs from original export')
                      attachment_proofs.append({'filename': name, 'role': EXPECTED_FILES[name],
                          'bytes': target.stat().st_size, 'sha256': digest(target), 'originalManifestAttachment': attachment})
                  filtered_path = selected_dir / 'manifest.json'
                  filtered_path.write_text(json.dumps(filtered, indent=2) + '\n')
                  (selected_dir / 'artifact-metadata.json').write_bytes(raw_metadata)
                  provenance = {'status': 'verified-original-failure-case-export', **original_identity,
                      'originalArtifactName': metadata['name'], 'originalZIPBytes': archive.stat().st_size,
                      'originalAPIDigest': metadata['digest'], 'originalZIPDigestVerified': True,
                      'originalAPIResponseSHA256': hashlib.sha256(raw_metadata).hexdigest(),
                      'originalArtifactMetadataFile': 'artifact-metadata.json',
                      'originalXcresultMembers': members,
                      'originalFullExportManifestSHA256': digest(original_manifest),
                      'filteredManifestSHA256': digest(filtered_path),
                      'attachmentCount': len(attachment_proofs), 'attachments': attachment_proofs,
                      'excludedOtherCasesAndSynthesizedEvents': True,
                      'downloadAuthentication': 'GitHub token only to fixed api.github.com requests; signed redirect fetched without Authorization; signed URL is not retained.',
                      'toolchain': toolchain.strip(),
                      'exportCommandForm': 'xcrun xcresulttool export attachments --path native-tests.xcresult --output-path all-attachments',
                      'exportCommandOrigin': SOURCE + ':scripts/test-native.sh:219',
                      'exporter': {'repository': os.environ.get('GITHUB_REPOSITORY'),
                          'workflowSourceSHA': os.environ.get('GITHUB_SHA'), 'runID': os.environ.get('GITHUB_RUN_ID'),
                          'runNumber': os.environ.get('GITHUB_RUN_NUMBER'), 'runAttempt': os.environ.get('GITHUB_RUN_ATTEMPT')},
                      'exportedAtUTC': datetime.now(timezone.utc).isoformat()}
                  (selected_dir / 'provenance.json').write_text(json.dumps(provenance, indent=2) + '\n')
                  require(len(list(selected_dir.iterdir())) == 11, 'Output must contain only eight originals and three provenance/manifest files')
                  shutil.rmtree(output)
                  selected_dir.rename(output)
                  print('Verified export: 7 original AX snapshots and 1 original MP4; original run 41369826898. No tests rerun.')
                  return 0
              except BaseException:
                  # Never print exception messages, tracebacks, HTTP response bodies or URLs.
                  # These can contain the temporary signed artifact URL, even without auth.
                  output.mkdir(parents=True, exist_ok=True)
                  for child in output.iterdir():
                      if child.is_file(): child.unlink()
                  (output / 'provenance.json').write_text(json.dumps({'status': 'failed-read-only-export',
                      **original_identity, 'failedStage': phase, 'errorDetailsRedacted': True}, indent=2) + '\n')
                  print('Failure evidence export failed during ' + phase + '; all error details redacted.', file=sys.stderr)
                  return 1
              finally:
                  shutil.rmtree(work, ignore_errors=True)
                  shutil.rmtree(selected_dir, ignore_errors=True)
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          PIVOT_EXPORT_PY

      - name: Upload only selected original failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: PIVOT-original-Max166-case240-failure-export-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pivot-failure-export/export-output/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
