name: Build SideStore IPA

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full release regression or focused diagnostics without an IPA
        type: choice
        default: all
        options: [all, lowest-waits, reference-ui, native-design, large-text, map-gestures]
        required: true
      simulator:
        description: iPhone used for focused diagnostics only
        type: choice
        default: iPhone 16 Pro Max
        options: ['iPhone SE (3rd generation)', 'iPhone 16 Pro', 'iPhone 16 Pro Max']
        required: true
  push:
    branches: [main, diagnostics/apple-native-redesign, feature/apple-native-redesign]
    paths:
      - 'PIVOT/**'
      - 'PIVOTUITests/**'
      - 'PIVOTTests/**'
      - 'PIVOT.xcodeproj/**'
      - 'PIVOTLiveActivityWidget/**'
      - 'scripts/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

jobs:
  build:
    if: (github.ref != 'refs/heads/diagnostics/apple-native-redesign' || contains(github.event.head_commit.message, '[full-regression]') || inputs.scope == 'all') && (github.event_name != 'workflow_dispatch' || inputs.scope == '' || inputs.scope == 'all')
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PIVOT_SIMULATOR_NAME: iPhone 16 Pro
    steps:
      - name: Check out iOS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Xcode toolchain
        run: xcodebuild -version

      - name: Run Xcode unit and simulator UI tests
        run: bash scripts/test-native.sh

      - name: Build and validate unsigned IPA
        env:
          PIVOT_BUILD_NUMBER: 100.${{ github.run_number }}.${{ github.run_attempt }}
        run: bash scripts/build-ipa.sh

      - name: Upload IPA and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-SideStore-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/ipa/*.ipa
            build/ipa/SHA256SUMS
            build/ipa/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/xcodebuild.log
            build/native-tests.log
            build/ui-screenshots
            build/simulator-selection.json
            build/test-scope.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve complete native test result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-xcresult-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/native-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  iphone-regression:
    if: (github.ref != 'refs/heads/diagnostics/apple-native-redesign' || contains(github.event.head_commit.message, '[full-regression]') || inputs.scope == 'all') && (github.event_name != 'workflow_dispatch' || inputs.scope == '' || inputs.scope == 'all')
    name: iPhone regression (${{ matrix.simulator }})
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        simulator: ['iPhone SE (3rd generation)', 'iPhone 16 Pro Max']
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PIVOT_SIMULATOR_NAME: ${{ matrix.simulator }}
    steps:
      - name: Check out iOS source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Xcode toolchain
        run: xcodebuild -version

      - name: Run native regression on selected iPhone
        run: bash scripts/test-native.sh

      - name: Upload iPhone regression results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-iPhone-${{ matrix.simulator }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/native-tests.log
            build/ui-screenshots
            build/simulator-selection.json
            build/test-scope.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve complete native test result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-iPhone-xcresult-${{ matrix.simulator }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/native-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7

  diagnose:
    name: Focused UI diagnostics
    if: (github.event_name == 'workflow_dispatch' && inputs.scope != '' && inputs.scope != 'all') || (github.event_name == 'push' && github.ref == 'refs/heads/diagnostics/apple-native-redesign' && !contains(github.event.head_commit.message, '[full-regression]'))
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      PIVOT_SIMULATOR_NAME: ${{ inputs.simulator || 'iPhone 16 Pro Max' }}
      PIVOT_TEST_SCOPE: ${{ inputs.scope || 'native-design' }}
    steps:
      - name: Check out candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Xcode toolchain
        run: xcodebuild -version

      - name: Run focused UI diagnostics
        run: bash scripts/test-native.sh

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-diagnostics-${{ inputs.simulator || 'iPhone 16 Pro Max' }}-${{ inputs.scope || 'native-design' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/native-tests.log
            build/ui-screenshots
            build/simulator-selection.json
            build/test-scope.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve complete native test result bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PIVOT-diagnostics-xcresult-${{ inputs.simulator || 'iPhone 16 Pro Max' }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/native-tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
